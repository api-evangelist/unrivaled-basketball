openapi: 3.0.0
info:
  title: Unrivaled Games API
  version: v8
  description: Official real-time data API for the Unrivaled professional women's 3x3 basketball league, operated by Sportradar as the league's Official Data Provider. Feeds cover schedules, standings, rosters, real-time scores, play-by-play, injuries, transfers, and season statistics, in JSON or XML. Assembled by API Evangelist on 2026-07-21 from the per-endpoint OpenAPI definitions embedded in the 23 Unrivaled reference pages at https://developer.sportradar.com/basketball/reference/unrivaled-overview; operation content is preserved verbatim from the source definitions.
  contact:
    url: https://developer.sportradar.com/basketball/reference/unrivaled-overview
  x-provenance:
    generated: '2026-07-21'
    method: searched
    source: https://developer.sportradar.com/basketball/reference/unrivaled-overview
servers:
- url: https://api.sportradar.com/unrivaled/
security:
- sec0: []
tags:
- name: Games
paths:
  /{access_level}/v8/{language_code}/games/{year}/{month}/{day}/schedule.{format}:
    get:
      responses:
        '200':
          description: ''
      parameters:
      - in: path
        name: access_level
        schema:
          type: string
          enum:
          - trial
          - production
          default: trial
        required: true
        description: The access level of your API key<br><br>`trial`, `production`
      - in: path
        name: language_code
        schema:
          type: string
          enum:
          - en
          default: en
        required: true
        description: 2-letter code for supported languages<br><br>`en` (English)
      - in: path
        name: year
        schema:
          type: string
          default: '2026'
          enum:
          - '2025'
          - '2026'
        required: true
        description: Year in `YYYY` format
      - in: path
        name: month
        schema:
          type: string
          enum:
          - '01'
          - '02'
          - '03'
          - '04'
          - '05'
          - '06'
          - '07'
          - 08
          - 09
          - '10'
          - '11'
          - '12'
          default: '01'
        required: true
        description: Month in `MM` format
      - in: path
        name: day
        schema:
          type: integer
          default: '01'
        required: true
        description: Date in `DD` format
      - in: path
        name: format
        schema:
          type: string
          enum:
          - json
          - xml
        required: true
        description: Format returned<br><br>`json`, `xml`
      operationId: get_access-level-v8-language-code-games-year-month-day-schedule-format
      summary: Daily Schedule
      description: '**Unrivaled Daily Schedule** provides date, time, location, and other event details for every game taking place in the league-defined day.'
      tags:
      - Games
  /{access_level}/v8/{language_code}/games/{game_id}/boxscore.{format}:
