        required: true
        description: The access level of your API key<br><br>`trial`, `production`
      - in: path
        name: language
        schema:
          type: string
          enum:
          - en
          default: en
        required: true
        description: 2-letter code for supported languages<br><br>`en` (English)
      - in: path
        name: season_year
        schema:
          type: string
          default: '2026'
          enum:
          - '2025'
          - '2026'
        required: true
        description: Season year in `YYYY` format
      - in: path
        name: season_type
        schema:
          type: string
          enum:
          - PRE
          - REG
          - OOT
          - PST
          default: REG
        required: true
        description: Type of season<br><br>`PRE` (Pre-season), `REG` (Regular Season), `OOT` (One-on-One Tournament), `PST` (Post-season)
      - in: path
        name: team_id
        schema:
          type: string
          default: 67c22115-2385-458f-8632-a67a025fef55
        required: true
