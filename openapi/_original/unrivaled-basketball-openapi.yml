openapi: 3.0.0
info:
  title: Unrivaled API
  version: v8
  description: Official real-time data API for the Unrivaled professional women's 3x3 basketball league, operated
    by Sportradar as the league's Official Data Provider. Feeds cover schedules, standings, rosters, real-time scores,
    play-by-play, injuries, transfers, and season statistics, in JSON or XML. Assembled by API Evangelist on 2026-07-21
    from the per-endpoint OpenAPI definitions embedded in the 23 Unrivaled reference pages at https://developer.sportradar.com/basketball/reference/unrivaled-overview;
    operation content is preserved verbatim from the source definitions.
  contact:
    url: https://developer.sportradar.com/basketball/reference/unrivaled-overview
  x-provenance:
    generated: '2026-07-21'
    method: searched
    source: https://developer.sportradar.com/basketball/reference/unrivaled-overview
servers:
- url: https://api.sportradar.com/unrivaled/
security:
- sec0: []
paths:
  /{access_level}/v8/{language_code}/league/{year}/{month}/{day}/changes.{format}:
    get:
      summary: Daily Change Log
      description: '**Unrivaled Daily Change Log** provides IDs and timestamps for teams, players, game statistics,
        schedules, and standings that have been modified on a given date. To receive the data updates, use these
        unique IDs to pull relevant API feeds.'
      operationId: get_new-endpoint
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              examples:
                Result:
                  summary: Result
                  value:
                    league:
                      id: 844ee10a-00c8-4dc1-9c17-52598de2ef47
                      name: Unrivaled
                      alias: UNRIVALED
                    start_time: '2026-01-02T05:00:00Z'
                    end_time: '2026-01-03T04:59:59Z'
                    players:
                    - id: 69d001d2-b7a5-4bd9-bcde-d5cbbfb005df
                      full_name: Tiffany Hayes
                      last_modified: '2026-01-02T17:04:22+00:00'
                    - id: c1841a50-2629-47bb-8c9b-ddd141372f71
                      full_name: Georgia Amoore
                      last_modified: '2026-01-02T17:10:20+00:00'
              schema:
                type: object
                properties:
                  league:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 844ee10a-00c8-4dc1-9c17-52598de2ef47
                      name:
                        type: string
                        example: Unrivaled
                      alias:
                        type: string
                        example: UNRIVALED
                  start_time:
                    type: string
                    example: '2026-01-02T05:00:00Z'
                  end_time:
                    type: string
                    example: '2026-01-03T04:59:59Z'
                  players:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 69d001d2-b7a5-4bd9-bcde-d5cbbfb005df
                        full_name:
                          type: string
                          example: Tiffany Hayes
                        last_modified:
                          type: string
                          example: '2026-01-02T17:04:22+00:00'
      parameters:
      - in: path
        name: access_level
        schema:
          type: string
          default: trial
          enum:
          - trial
          - production
        required: true
        description: The access level of your API key<br><br>`trial`, `production`
      - in: path
        name: language_code
        schema:
          type: string
          enum:
          - en
