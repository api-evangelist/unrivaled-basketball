        schema:
          type: string
          default: trial
          enum:
          - trial
          - production
        required: true
        description: The access level of your API key<br><br>`trial`, `production`
      - in: path
        name: language_code
        schema:
          type: string
          enum:
          - en
          default: en
        required: true
        description: 2-letter code for supported languages<br><br>`en` (English)
      - in: path
        name: season_year
        schema:
          type: string
          enum:
          - '2026'
          default: '2026'
        required: true
        description: Season year in `YYYY` format
      - in: path
        name: season_type
        schema:
          type: string
          default: REG
          enum:
          - PRE
          - REG
          - OOT
          - PST
        required: true
        description: Type of season<br><br>`PRE` (Pre-season), `REG` (Regular Season), `OOT` (One-on-One Tournament),
          `PST` (Post-season)
      - in: path
        name: format
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
        required: true
        description: Format returned<br><br>`json`, `xml`
