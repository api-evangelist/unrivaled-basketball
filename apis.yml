aid: unrivaled-basketball
name: Unrivaled Basketball
description: >-
  Unrivaled is a U.S. professional women's 3x3 basketball league co-founded by
  Napheesa Collier and Breanna Stewart, playing a condensed winter season with
  six clubs and a midseason 1-on-1 tournament. The league's official real-time
  data API — the Unrivaled API v8 — is operated by Sportradar as the league's
  Official Data Provider, delivering schedules, standings, rosters, live
  scores, play-by-play (including the Elam Ending and weighted free throws),
  injuries, transfers, and season statistics in JSON or XML.
